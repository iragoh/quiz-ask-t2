            width: 100vw;

            background: linear-gradient(to bottom, #050514, #0a0a2a, #110934);
        }

            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;

            flex-direction: column;

            align-items: center;
            z-index: 50;
            padding: 20px;
            box-sizing: border-box;
        }
